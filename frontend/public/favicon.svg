<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c33" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Node Glow Filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Cosmic Hexagon Background Base -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="1.8" stroke-opacity="0.5" />

  <!-- Constellation Prerequisite Energy Lines -->
  <line x1="32" y1="16" x2="16" y2="44" stroke="#00ff9d" stroke-width="2" stroke-opacity="0.85" />
  <line x1="32" y1="16" x2="48" y2="44" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.85" />
  <line x1="16" y1="44" x2="48" y2="44" stroke="#ffaa00" stroke-width="2" stroke-opacity="0.85" />

  <!-- Starlight Cross Flare Spikes at top node -->
  <path d="M32 8 L32 24 M24 16 L40 16" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.95" />

  <!-- Glowing Constellation Nodes -->
  <!-- Top Node (Cyan / White Flare) -->
  <circle cx="32" cy="16" r="5" fill="#ffffff" filter="url(#glowCyan)" />
  <circle cx="32" cy="16" r="3.5" fill="#00f0ff" />

  <!-- Bottom Left Node (Emerald) -->
  <circle cx="16" cy="44" r="4.5" fill="#00ff9d" filter="url(#glowCyan)" />
  
  <!-- Bottom Right Node (Solar Gold) -->
  <circle cx="48" cy="44" r="4.5" fill="#ffaa00" filter="url(#glowGold)" />
</svg>
